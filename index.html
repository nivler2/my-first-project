<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON SWARM: CHROMA DEFENSE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>NEON SWARM: CHROMA DEFENSE</h1>
      <p class="instructions">
        Move: WASD / Arrow Keys · Aim: Mouse · Shoot: Hold mouse · Dash: Space · Pulse: Shift · Colors: 1 (Red), 2 (Blue), 3 (Green)
      </p>

      <section class="hud" aria-label="Game HUD">
        <div>Score <span id="score">0</span></div>
        <div>Match <span id="matchTimer">180</span>s</div>
        <div>Combo x<span id="combo">1</span> <span id="comboTimer">0.0</span>s</div>
        <div>Core <span id="coreHealth">100</span>%</div>
        <div>Hull <span id="playerHealth">100</span>%</div>
      </section>

      <canvas id="gameCanvas" width="1000" height="620" aria-label="Neon Swarm arena"></canvas>
      <p id="status" role="status"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
